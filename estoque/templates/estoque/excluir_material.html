<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Excluir Material - Estoque Maker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">
                Estoque Maker
            </a>
        </div>
    </nav>

    <main class="container mt-5">
        <div class="card border-danger">
            <div class="card-body">
                <h2 class="text-danger">Excluir material</h2>

                <p>
                    Tem certeza de que deseja excluir
                    <strong>{{ material.nome }}</strong>?
                </p>

                <p class="text-muted">
                    Esta ação não poderá ser desfeita.
                </p>

                <form method="POST">
                    {% csrf_token %}

                    <button type="submit"
                            class="btn btn-danger">
                        Confirmar exclusão
                    </button>

                    <a href="{% url 'lista_materiais' %}"
                       class="btn btn-secondary">
                        Cancelar
                    </a>
                </form>
            </div>
        </div>
    </main>

</body>
</html>
