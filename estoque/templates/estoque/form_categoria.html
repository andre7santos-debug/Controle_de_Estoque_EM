<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} - Estoque Maker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">
            Estoque Maker
        </a>
    </div>
</nav>

<main class="container mt-5">
    <h1>{{ titulo }}</h1>

    <div class="card mt-4">
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}

                {% for campo in form %}
                <div class="mb-3">
                    <label class="form-label"
                           for="{{ campo.id_for_label }}">
                        {{ campo.label }}
                    </label>

                    {{ campo }}

                    {% for erro in campo.errors %}
                    <div class="text-danger small">
                        {{ erro }}
                    </div>
                    {% endfor %}
                </div>
                {% endfor %}

                <button type="submit" class="btn btn-primary">
                    Salvar categoria
                </button>

                <a href="{% url 'lista_categorias' %}"
                   class="btn btn-secondary">
                    Cancelar
                </a>
            </form>
        </div>
    </div>
</main>

</body>
</html>
