<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Novo Material - Estoque Maker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">
                Estoque Maker
            </a>
        </div>
    </nav>

    <main class="container mt-5">

        <h1>Cadastrar novo material</h1>
        <p class="text-muted">
            Preencha os dados do material.
        </p>

        <div class="card mt-4">
            <div class="card-body">

                <form method="POST">
                    {% csrf_token %}

                    {% for campo in form %}
                        <div class="mb-3">
                            <label class="form-label"
                                   for="{{ campo.id_for_label }}">
                                {{ campo.label }}
                            </label>

                            {{ campo }}

                            {% for erro in campo.errors %}
                                <div class="text-danger small">
                                    {{ erro }}
                                </div>
                            {% endfor %}
                        </div>
                    {% endfor %}

                    {% if form.non_field_errors %}
                        <div class="alert alert-danger">
                            {{ form.non_field_errors }}
                        </div>
                    {% endif %}

                    <button type="submit"
                            class="btn btn-primary">
                        Salvar material
                    </button>

                    <a href="{% url 'lista_materiais' %}"
                       class="btn btn-secondary">
                        Cancelar
                    </a>

                </form>

            </div>
        </div>

    </main>

</body>
</html>
