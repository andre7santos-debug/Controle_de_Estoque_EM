<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Estoque Maker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            border: none;
            border-radius: 15px;
        }

        .login-icon {
            font-size: 48px;
            color: #0d6efd;
        }
    </style>
</head>

<body class="bg-light">

    <main class="container d-flex justify-content-center py-4">

        <div class="card login-card shadow-sm p-4">

            <div class="text-center mb-4">

                <i class="bi bi-box-seam login-icon"></i>

                <h2 class="mt-3">
                    Estoque Maker
                </h2>

                <p class="text-muted mb-0">
                    Sistema de Controle de Estoque
                </p>

            </div>

            {% if messages %}

                {% for message in messages %}

                    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <input type="hidden" name="next" value="{{ next }}">

                <div class="mb-3">

                    <label class="form-label" for="username">
                        Usuário
                    </label>

                    <input
                        type="text"
                        name="username"
                        id="username"
                        class="form-control"
                        placeholder="Digite seu usuário"
                        autocomplete="username"
                        required
                        autofocus
                    >

                </div>

                <div class="mb-4">

                    <label class="form-label" for="password">
                        Senha
                    </label>

                    <input
                        type="password"
                        name="password"
                        id="password"
                        class="form-control"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Entrar
                </button>

            </form>

            <hr class="mt-4 mb-3">

            <div class="text-center">

                <small class="text-muted">
                    Espaço Maker — IFSULDEMINAS
                    <br>
                    Campus Muzambinho
                </small>

            </div>

        </div>

    </main>

</body>
</html>
